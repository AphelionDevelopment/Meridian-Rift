  - bugfix: Felinids (and nightmares) can once again use more complex objects, unlike
      monkeys.
  - balance: Bees are now friendly to any plant-like creature for that matter.
  - balance: Cats will now also follow laser pointers, not just felinids.
  - bugfix: Bonus biotypes from dna infusions shouldn't be lost on species change
      as long as you have enough infused organs.
  Hatterhat:
  - balance: Sterilizine now cleanses gaseous miasma into gaseous oxygen when exposed
