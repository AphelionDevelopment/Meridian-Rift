2026-08-17:
  Absolucy:
  - bugfix: Jellypeople can speak Slime language again.
  Aliceee2ch:
  - qol: Winter coats were added into loadout.
  - spellcheck: Capitalizes some of the other suits in loadout menu.
  - refactor: Refactored private orders to use component and spawn respective crates,
      instead of specific one. This should fix potential issues, e.g where order is
      tied to custom crate (like stasis crate turtles!!!)
  - bugfix: Fixed private orders (goodies).
  - qol: Medical Records console now uses dropdowns for blood type field instead of
      manual typing
  - bugfix: Soaps have different price in cargo now.
  - bugfix: Removed AI tracking beacon from Ripley subcategory.
  ArcaneMusic:
  - qol: Tweaked the TGUi on the mulebot in order to read the name of the loaded item
      more easily.
  - qol: The Mulebot now has more visual feedback when items are being loaded onto
      them.
  - sound: Mulebots now have sound effects when loading and unloading.
  - bugfix: Weakpoints, and weakpoints spawned by weakpoints being detonated, should
      no longer be spawning invisible.
  - balance: The number of weakpoints that spawn on regular maps has increased from
      3 to 5.
  - balance: The number of weakpoints that spawn on the "Structural Weaknesses" station
      trait now spawns 6 to 12, instead of 4 to 8 weakpoints.
  - balance: Golems now have slightly less aggressive metabolism.
  - bugfix: Golem foods now offer different levels of nutrition! Finally!
  - balance: Golems now offer more nutrition from rarer ores.
  - balance: Golems now get further additional nutrition from eating processed ore
      sheets instead of raw ore.
  - map: The free golem ship now has shutters to block wildlife from attacking while
      inside.
  - bugfix: Cooldown modkits and AOE modkits now work as intended. Cooldowns make
      the gun shoot faster, and AOE modkits will make the gun slightly slower, regardless
      of the order they're installed in.
  - spellcheck: fixed typo on the disabler SMG goody from the console.
  - bugfix: Stock blocks now properly show their sale value after they've become liquid,
      and been examined.
  - bugfix: EMP resistance is only tagged when examined on actually EMP resistant
      clothing.
  - code_imp: We now unit test to confirm that crates, and crate subtypes sell for
      their expected value. Also checks for exports whose export_type is explicitly
      called out in excluded types.
  - bugfix: Coffins and various crate subtypes now sell again. For the first time
      in 4 years.
  ArrisFairburne:
  - image: most ballistics bullets have a flashy look to them, which aids readability
  Fabian272:
  - bugfix: Black broth no longer requires ice to make.
  FalloutFalcon:
  - bugfix: Ants and shade mobs are plural is seemingly intended
  - code_imp: Adds mirror to download byond versions for CLI
  Fghj240:
  - rscadd: Added a new virus chem, Exotic Agar, that gives you level 9 symptoms
  - balance: Reorganized virus symptoms among 9 levels instead of 8.
  - balance: The dizziness virus symptom has higher stats and slightly shorter status
