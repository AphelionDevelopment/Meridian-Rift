  - bugfix: if a headset starts with a 2nd key in it, it will have that key inside
      of itself instead of in nullspace (this has no gameplay effect)
  Ghommie:
  - rscadd: Added a replace text circuit component.
  - balance: The boulder processing machinery can maim any (incapacitated/dead) mob
      with the mineral biotype, not just golems.
  - refactor: 'some quirky interactions with specific (non-roundstart) species have
      been de-hardcoded. An example: peanut butter gets those with abductor brains
      high rather than just those with the abductor species. Report any oddity with
      that (the refactor, not the peanut butter...).'
  - sound: human (vocal) emote sounds are no longer dictated by the species directly,
      but the tongue of your spaceman. Having a lizard tongue will make you scream,
      laugh and death-gasp like a lizardperson, even if you are not. This may also
      give a few species emote sounds that hardly fit their themes... rather than
      have no sound at all.
  - rscadd: included a few preexisting emote sounds to subtypes like the robot voicebox
      and alien tongues.
  - rscadd: Wearing a monkey mask will change the sound of screams to monkey screeches.
