  - balance: reactive tesla armor, adamantine armor, the mod emp shield module, and
      tinfoil hats slightly lower the severity of incoming EMPs.
  - qol: You can see what bodyparts a piece of clothing with armor covers by examining
      its tag.
  - qol: IDC-27 contains symptom levels
  Gandalf2k15:
  - rscadd: MCR's are back!
  - bugfix: Mutant ghost polling is no longer broken.
  - rscadd: Favourites tab
  Gboster-0:
