  Melbert:
  - rscadd: Zombie is no longer a distinct "species" (except High-Functioning Zombie
      on Halloween), meaning Lizards, Moths, and Ethereals can now become Zombies
      and will keep (some/most of) their identifying features
  - rscadd: Impure Krokodil also no longer changes your species, now just making you
      a zombie husk with none of the "upsides"
  - rscadd: Zombies are now husks mechanically, which ultimately shouldn't change
      much
  - rscdel: Androids and other undead creatures can no longer become zombies from
      Romerol (previously, only Golems, Skeletons, and Plasmamen were immune to it)
  - refactor: Refactored butchering, report any weirdness in amount and type of meat
      gained
  - rscdel: Voltaic heart no longer grants EMP immunity, though is still EMP immune
      itself.
  - rscdel: Voltaic heart no longer deletes itself if you remove it, though it is
      still otherwise rendered unusable.
  - spellcheck: Regeneration chat messages read better
  - rscdel: Deleted "Enriched Liquid Electricity". It's now just "Liquid Electricity",
      though it can still be enriched to shock people. Ethereal blood is still un-enriched.
      Some recipes may still demand enriched Liquid Electricity.
  - rscadd: Botany plants producing Liquid Electricity now produce un-enriched Liquid
      Electricity unless the plant has Electrical Activity.
  - rscadd: Jupiter Cups now have Electrical Activity by default, in order to produce
      enriched Liquid Electricity.
  - refactor: Refactored the way botany plants set up their reagents. Report any oddities,
      particularly with traits that activate on harvest (like auto-distilling composition),
      their tastes, or with special reagents (like blood or vitamins).
  - qol: Surplus crate items show up in roundend report
  - rscadd: You can use food items in place of some organs for "organ manipulation"...It
      won't work, but y'know, you can do it
  - qol: Organ manipulation will cancel mid operation if it suddenly becomes invalid,
      rather than allow it to continue
  - map: '[Kilo] Remapped Atmospherics entirely'
  - map: '[Kilo] Touched up Engineering (re-arranged some equipment, tables, piping,
      decals, signage, etc.)'
  - qol: Bitrunner domain names are no longer hidden until you upgrade the server
      stock parts. Distantly unaffordable domains still have their names hidden.
  - admin: Law text is in silicon log again
  - balance: In addition to being stunned, AIs are blocked from using certain machines
      like APCs and turrets for a period after their core laws are changed (or if
      their rack is destroyed or leaves the z-level).
  - qol: Gizmos pulsed by assembies give feedback sounds
  - qol: Gizmo feedback alerts are shown to all nearby mobs, rather than just the
      pulser
  - qol: Stasis bodybags don't decay in freezing temperatures, such as those present
      in morgue slabs
  - bugfix: Fix lesser magic mirror (and friends) race selection
  - rscdel: Mobs will no longer log their initial name change (I.e. "name changed
      from (nothing) to John Doe")
  - bugfix: If a cuffed item enters an anchored object like a closet, the cuffee become
      stuck to the anchored object, rather than the anchored object being stuck to
      the cuffee.
  - bugfix: You can no longer put cuffed objects in any object manually (i.e. by clicking
      on it). This affects objects like grinders, deep fryers, and soup pots.
  - qol: Cuffed item examine text is now shown in examine, rather than double-examine
  - balance: Any mob can attempt to remove someone's cuffed item, rather than just
      the cuffee. However it takes double the amount of time for non-cuffees.
  - qol: Ion laws have gibberish numbers again
  - rscdel: AIs can no longer have two laws with the exact same text.
  - bugfix: Some personalities like Empathetic or Misanthropic no longer react to
